name: check_links

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Runs every Monday at 08:00 UTC
    - cron: "0 8 * * 1"

jobs:
  check_links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 🔗 Link Checker
        uses: lycheeverse/lychee-action@v2
        with:
          # The repository is private, so GitHub links need a token to resolve.
          token: ${{ secrets.GITHUB_TOKEN }}
          args: ./**/*.md
          fail: true
