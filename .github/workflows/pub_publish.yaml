name: pub_publish

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*" # tag pattern on pub.dev: 'v{{version}}'
  workflow_dispatch:

jobs:
  publish:
    permissions:
      id-token: write # Required for authentication using OIDC
    runs-on: ubuntu-latest

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7

      - name: 🎯 Setup Dart
        uses: dart-lang/setup-dart@v1.8.1
        with:
          sdk: "3.13.0"

      - name: 📦 Install Dependencies
        run: dart pub get

      # vgv_ai_plugins first: the CLI resolves it from pub.dev, so publishing
      # the CLI against a version that is not there yet fails.
      - name: 📢 Publish vgv_ai_plugins
        working-directory: packages/vgv_ai_plugins
        run: dart pub publish --force

      - name: 📢 Publish vgv_ai_cli
        working-directory: packages/vgv_ai_cli
        run: dart pub publish --force
