name: release_please

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release_please:
    runs-on: ubuntu-latest

    steps:
      # .release-please-config.json pins both packages with "release-as": "0.1.0"
      # for the first release. Remove it once 0.1.0 is published (#107).
      - name: 🚀 Release Please
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          manifest-file: ".release-please-manifest.json"
          config-file: ".release-please-config.json"
