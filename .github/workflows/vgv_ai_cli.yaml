name: vgv_ai_cli

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - ".github/workflows/vgv_ai_cli.yaml"
      - "packages/vgv_ai_cli/lib/**"
      - "packages/vgv_ai_cli/test/**"
      - "packages/vgv_ai_cli/pubspec.yaml"
      - "bricks/**"
      - "tool/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/vgv_ai_cli.yaml"
      - "packages/vgv_ai_cli/lib/**"
      - "packages/vgv_ai_cli/test/**"
      - "packages/vgv_ai_cli/pubspec.yaml"
      - "bricks/**"
      - "tool/**"

jobs:
  semantic-pull-request:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/semantic_pull_request.yml@v1.21.1

  build:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/dart_package.yml@v1.21.1
    with:
      dart_sdk: "3.13.0"
      working_directory: packages/vgv_ai_cli

  spell-check:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/spell_check.yml@v1.21.1
    with:
      includes: |
        **/*.md
        !bricks/**/__brick__/**
        .*/**/*.md
      modified_files_only: false

  build-hooks:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/dart_package.yml@v1.21.1
    with:
      dart_sdk: "3.13.0"
      working_directory: bricks/agents/hooks

  verify-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v4

      - name: 🎯 Setup Dart
        uses: dart-lang/setup-dart@v1.7.2
        with:
          sdk: "3.13.0"

      - name: 🧱 Install Mason
        run: dart pub global activate mason_cli 0.1.3

      - name: 🔄 Regenerate bundle
        run: bash tool/generate_agents_bundle.sh

      - name: 🔎 Verify bundle is up to date
        run: |
          templates="packages/vgv_ai_cli/lib/src/templates"
          if [ -n "$(git status --porcelain "$templates")" ]; then
            echo "::error::$templates changed after regenerating the bundle."
            echo "Run tool/generate_agents_bundle.sh and commit the result."
            git status --porcelain "$templates"
            git diff -- "$templates"
            exit 1
          fi

  verify-version:
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7

      - name: 🎯 Setup Dart
        uses: dart-lang/setup-dart@v1.8.1
        with:
          sdk: "3.13.0"

      - name: 📦 Install Dependencies
        working-directory: packages/vgv_ai_cli
        run: |
          dart pub get

      - name: 🔎 Verify version
        working-directory: packages/vgv_ai_cli
        run: dart run test --run-skipped -t version-verify
