name: vgv_ai_cli

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - ".github/workflows/vgv_ai_cli.yaml"
      - "packages/vgv_ai_cli/lib/**"
      - "packages/vgv_ai_cli/test/**"
      - "packages/vgv_ai_cli/pubspec.yaml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/vgv_ai_cli.yaml"
      - "packages/vgv_ai_cli/lib/**"
      - "packages/vgv_ai_cli/test/**"
      - "packages/vgv_ai_cli/pubspec.yaml"

jobs:
  semantic-pull-request:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/semantic_pull_request.yml@v1

  # TODO: Revert to the reusable `dart_package.yml` workflow once
  # very_good_workflows 1.21.1 is released. That release bundles
  # very_good_cli 1.5.0, which adds pub workspace support and fixes the
  # coverage collection error (`.dart_tool/package_config.json` not found).
  # Until then, this inline job pins very_good_cli ^1.5.0 manually.
  #
  # Replacement once 1.21.1 is out:
  #   build:
  #     uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/dart_package.yml@v1.21.1
  #     with:
  #       dart_sdk: "3.13.0"
  #       working_directory: packages/vgv_ai_cli
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/vgv_ai_cli
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v4

      - name: 🎯 Setup Dart
        uses: dart-lang/setup-dart@v1.7.2
        with:
          sdk: "3.13.0"

      - name: 🐦 Install Very Good CLI
        run: dart pub global activate very_good_cli "^1.5.0"

      - name: 📦 Install Dependencies
        run: dart pub get

      - name: ✨ Check Formatting
        run: dart format --set-exit-if-changed .

      - name: 🔍 Analyze
        run: dart analyze --fatal-infos --fatal-warnings lib test

      - name: 🧪 Run Tests
        run: very_good test -j 4 --coverage --min-coverage 100 --optimization

  spell-check:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/spell_check.yml@v1
    with:
      includes: |
        **/*.md
        !brick/**/*.md
        .*/**/*.md
      modified_files_only: false

  verify-version:
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v2

      - name: 🎯 Setup Dart
        uses: dart-lang/setup-dart@v1.7.2
        with:
          sdk: "3.13.0"

      - name: 📦 Install Dependencies
        working-directory: packages/vgv_ai_cli
        run: |
          dart pub get

      - name: 🔎 Verify version
        working-directory: packages/vgv_ai_cli
        run: dart run test --run-skipped -t version-verify
