name: vgv_ai_cli

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - ".github/workflows/vgv_ai_cli.yaml"
      - "packages/vgv_ai_cli/lib/**"
      - "packages/vgv_ai_cli/test/**"
      - "packages/vgv_ai_cli/pubspec.yaml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/vgv_ai_cli.yaml"
      - "packages/vgv_ai_cli/lib/**"
      - "packages/vgv_ai_cli/test/**"
      - "packages/vgv_ai_cli/pubspec.yaml"

jobs:
  semantic-pull-request:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/semantic_pull_request.yml@v1.21.1

  build:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/dart_package.yml@v1.21.1
    with:
      dart_sdk: "3.13.0"
      working_directory: packages/vgv_ai_cli

  spell-check:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/spell_check.yml@v1.21.1
    with:
      includes: |
        **/*.md
        !brick/**/*.md
        .*/**/*.md
      modified_files_only: false

  verify-version:
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v2

      - name: 🎯 Setup Dart
        uses: dart-lang/setup-dart@v1.7.2
        with:
          sdk: "3.13.0"

      - name: 📦 Install Dependencies
        working-directory: packages/vgv_ai_cli
        run: |
          dart pub get

      - name: 🔎 Verify version
        working-directory: packages/vgv_ai_cli
        run: dart run test --run-skipped -t version-verify
