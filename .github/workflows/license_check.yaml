name: license_check

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - main
    paths:
      - "packages/vgv_ai_cli/pubspec.yaml"
      - "packages/plugin_source/pubspec.yaml"
      - ".github/workflows/license_check.yaml"
  push:
    branches:
      - main
    paths:
      - "packages/vgv_ai_cli/pubspec.yaml"
      - "packages/plugin_source/pubspec.yaml"
      - ".github/workflows/license_check.yaml"

jobs:
  license_check:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/license_check.yml@a4f875e7f3138aac36bfbce27cd45aeb29afcc5e
    with:
      working_directory: .
      allowed: "MIT,BSD-3-Clause,BSD-2-Clause,Apache-2.0"
