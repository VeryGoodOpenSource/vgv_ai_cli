name: release_binaries

# Compiles vgv_ai for macOS and Linux on each vX.Y.Z release, attaches the
# archives and their checksums to the GitHub release, and updates the Homebrew
# formula in VeryGoodOpenSource/homebrew-tap. install.sh downloads the same
# archives.
#
# Pull requests that touch the release tooling only build the binaries, so a
# change that breaks `dart compile exe` is caught before a release.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*" # the CLI's release tags; vgv_ai_plugins tags start with its name
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag to build and publish, such as v0.2.0"
        required: true
  pull_request:
    paths:
      - ".github/workflows/release_binaries.yaml"
      - "install.sh"
      - "tool/generate_homebrew_formula.sh"
      - "packages/vgv_ai_cli/bin/**"
      - "packages/vgv_ai_cli/pubspec.yaml"
      - "pubspec.lock"

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-15
          - target: macos-x64
            runner: macos-15-intel
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: linux-x64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: 🎯 Setup Dart
        uses: dart-lang/setup-dart@v1.8.1
        with:
          sdk: "3.13.0"

      - name: 📦 Install Dependencies
        run: dart pub get

      - name: 🔨 Compile
        run: |
          mkdir -p build/stage build/dist
          dart compile exe packages/vgv_ai_cli/bin/vgv_ai.dart -o build/stage/vgv_ai
          cp LICENSE build/stage/LICENSE

      - name: 🔎 Verify version
        run: |
          version="$(build/stage/vgv_ai --version | head -n 1)"
          echo "vgv_ai --version: $version"
          if [ "${{ github.event_name }}" != "pull_request" ] && [ "v$version" != "$TAG" ]; then
            echo "::error::The binary reports $version, but the release is $TAG."
            exit 1
          fi

      - name: 📦 Archive
        run: |
          archive="vgv_ai-${{ matrix.target }}.tar.gz"
          tar -czf "build/dist/$archive" -C build/stage vgv_ai LICENSE
          cd build/dist
          if command -v sha256sum >/dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          cat "$archive.sha256"

      - name: ⬆️ Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vgv_ai-${{ matrix.target }}
          path: build/dist/*
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: ⬇️ Download Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: vgv_ai-*
          path: dist
          merge-multiple: true

      - name: 🚀 Attach to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" dist/* --clobber --repo "${{ github.repository }}"
          # release-please releases vgv_ai_plugins alongside the CLI. Marking
          # the CLI's release as latest keeps releases/latest/download, which
          # install.sh reads, pointing at these archives.
          gh release edit "$TAG" --latest --repo "${{ github.repository }}"

  homebrew:
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: ⬇️ Download Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: vgv_ai-*
          path: dist
          merge-multiple: true

      - name: 📚 Checkout Tap
        uses: actions/checkout@v7
        with:
          repository: VeryGoodOpenSource/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: 🍺 Update Formula
        run: |
          mkdir -p homebrew-tap/Formula
          bash tool/generate_homebrew_formula.sh "$TAG" dist > homebrew-tap/Formula/vgv_ai.rb
          cat homebrew-tap/Formula/vgv_ai.rb

      - name: 🤖 Commit and Push
        working-directory: homebrew-tap
        run: |
          git config user.name VGV Bot
          git config user.email vgvbot@users.noreply.github.com
          git add Formula/vgv_ai.rb
          if git diff --cached --quiet; then
            echo "Formula/vgv_ai.rb is already at $TAG."
            exit 0
          fi
          git commit -m "feat: vgv_ai ${TAG#v}"
          git push
