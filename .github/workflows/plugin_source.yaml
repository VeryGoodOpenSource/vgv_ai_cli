name: plugin_source

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - ".github/workflows/plugin_source.yaml"
      - "packages/plugin_source/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/plugin_source.yaml"
      - "packages/plugin_source/**"

jobs:
  semantic-pull-request:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/semantic_pull_request.yml@v2.0.1

  build:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/dart_package.yml@v2.0.1
    with:
      dart_sdk: "3.13.0"
      working_directory: packages/plugin_source
      run_cognitive_complexity: true
      cognitive_complexity_targets: packages/plugin_source/lib
      cognitive_complexity_diff_base: HEAD
