name: vgv_ai_cli
description: A CLI that configures Very Good AI coding agents and tooling
version: 0.1.0
repository: https://github.com/VeryGoodOpenSource/vgv_ai_cli
issue_tracker: https://github.com/VeryGoodOpenSource/vgv_ai_cli/issues
# Not published. `plugin_source`, which this depends on, is `publish_to: none`,
# and the CLI is installed from source rather than pub.dev.
publish_to: none
resolution: workspace
environment:
  sdk: ^3.13.0

dependencies:
  args: ^2.7.0
  cli_completion: ^0.6.0
  collection: ^1.19.1
  crypto: ^3.0.7
  equatable: ^2.1.0
  file: ^7.0.1
  mason: ^0.1.0
  mason_logger: ^0.3.6
  path: ^1.9.1
  plugin_source: ^0.1.0
  pub_semver: ^2.2.1
  pub_updater: ^0.6.0
  toml: ^0.18.0

dev_dependencies:
  build_runner: ^2.16.2
  build_verify: ^3.1.1
  build_version: ^2.1.3
  mocktail: ^1.0.5
  test: ^1.33.0
  very_good_analysis: ^11.0.0
  yaml: ^3.1.4

executables:
  vgv_ai:
